<text x="39" y="204" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#f2f8ff" >Every login leaves a story.</text>
<text x="39" y="239" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#a6b9c8" >Local authentication monitoring with</text>
