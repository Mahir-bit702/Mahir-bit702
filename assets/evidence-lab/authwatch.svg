<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="422" viewBox="0 0 1000 422" role="img" aria-labelledby="title"><title id="title">AuthWatch — local Windows authentication monitoring, explainable detections, incident replay and evidence export. Illustrative interface concept.</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101c"/><stop offset=".5" stop-color="#07151b"/><stop offset="1" stop-color="#0c1224"/></linearGradient><radialGradient id="aura" cx=".8" cy=".15" r=".8"><stop stop-color="#5bffb3" stop-opacity=".17"/><stop offset="1" stop-color="#5bffb3" stop-opacity="0"/></radialGradient><linearGradient id="edge" x1="0" x2="1"><stop stop-color="#5bffb3" stop-opacity=".8"/><stop offset=".55" stop-color="#62dfff" stop-opacity=".25"/><stop offset="1" stop-color="#bca0ff" stop-opacity=".5"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#78adc7" stroke-width=".55" opacity=".22" fill="none"/></pattern><filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter><clipPath id="clip"><rect x="1" y="1" width="998" height="999" rx="22"/></clipPath></defs><style>.replay{stroke-dasharray:36 356;animation:replay 8s linear infinite}@keyframes replay{to{stroke-dashoffset:-392}}@media(prefers-reduced-motion:reduce){.replay{animation:none}}</style><rect x="1" y="1" width="998" height="420" rx="22" fill="url(#bg)" stroke="url(#edge)" /><rect x="2" y="2" width="996" height="418" rx="21" fill="url(#aura)" stroke="none" />
<text x="34" y="36" font-family="Consolas,'Liberation Mono',monospace" font-size="12" fill="#5bffb3" letter-spacing="1">CASE FILE 01 / INCIDENT STORIES</text><text x="967" y="36" font-family="Consolas,'Liberation Mono',monospace" font-size="12" fill="#62dfff" text-anchor="end">EXPLORE THE SOURCE ↗</text>
